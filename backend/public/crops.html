<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Crops &amp; Varieties</title>
<link rel="stylesheet" href="/admin.css" />
</head>
<body>

<div id="admin-nav"></div>

<div class="page page-wide">
<div class="panel">
<h1>Crops &amp; Varieties</h1>
<p id="scope-note" class="scope-note"></p>
<p id="tree-error" class="error" style="display:none"></p>
<div id="tree"></div>
<div id="top-add" class="bottom-add" style="display:none">
  <input type="text" id="top-add-input" placeholder="New crop name" />
  <button id="top-add-btn" class="primary">+ Add Crop</button>
</div>
</div>
</div>

<script src="/admin-shared.js"></script>
<script>
const LEVELS = [
  {
    key: 'crop', label: 'Crop',
    listPath: () => '/master/crops', dataKey: 'crops',
    createPath: '/master/crops', createBody: (parentId, name) => ({ name }),
    itemPath: (id) => `/master/crops/${id}`,
    countriesPath: (id) => `/master/crops/${id}/countries`,
  },
  {
    key: 'variety', label: 'Variety',
    listPath: (parentId) => `/master/varieties?crop_id=${parentId}`, dataKey: 'varieties',
    createPath: '/master/varieties', createBody: (parentId, name) => ({ crop_id: parentId, name }),
    itemPath: (id) => `/master/varieties/${id}`,
    countriesPath: (id) => `/master/varieties/${id}/countries`,
  },
];

let currentUser = null;
let allCountries = [];
let countryNameById = new Map();
const expanded = { crop: new Set() };
const cache = new Map();
let editingId = null;
let deletingId = null;
let assigningId = null;

function canWrite() {
  return currentUser.role === 'super_admin';
}

function showTreeError(message) {
  const el = document.getElementById('tree-error');
  el.textContent = message;
  el.style.display = 'block';
}
function clearTreeError() {
  document.getElementById('tree-error').style.display = 'none';
}

async function fetchLevelItems(level, parentId) {
  const cacheKey = `${level.key}:${parentId}`;
  if (cache.has(cacheKey)) return cache.get(cacheKey);
  const res = await authedFetch(level.listPath(parentId));
  const data = await res.json();
  const items = data[level.dataKey];
  cache.set(cacheKey, items);
  return items;
}

function countryBadgeHtml(item) {
  if (!item.country_ids || !item.country_ids.length) {
    return '<span class="country-badge">Global</span>';
  }
  const names = item.country_ids.map((id) => countryNameById.get(id) || '?').join(', ');
  return `<span class="country-badge restricted">Only: ${escapeHtml(names)}</span>`;
}

function countryChecklistHtml(levelIndex, item) {
  const assigned = new Set(item.country_ids || []);
  const options = allCountries.map((c) => `
    <label>
      <input type="checkbox" class="country-check" value="${c.id}" ${assigned.has(c.id) ? 'checked' : ''} />
      ${escapeHtml(c.name)}
    </label>
  `).join('');
  return `
    <div class="country-checklist" data-level="${levelIndex}" data-id="${item.id}">${options}</div>
    <div class="country-checklist-actions">
      <button class="small save-countries-btn primary" data-level="${levelIndex}" data-id="${item.id}">Save</button>
      <button class="small cancel-btn" data-action="cancel">Cancel</button>
    </div>
  `;
}

async function buildLevelHtml(levelIndex, parentId) {
  const level = LEVELS[levelIndex];
  const items = await fetchLevelItems(level, parentId);
  const hasNextLevel = levelIndex < LEVELS.length - 1;

  let html = '<ul class="tree-level">';
  for (const item of items) {
    const isExpanded = hasNextLevel && expanded[level.key].has(item.id);
    const isEditing = item.id === editingId;
    const isDeleting = item.id === deletingId;
    const isAssigning = item.id === assigningId;

    html += '<li><div class="tree-row">';

    if (isEditing) {
      html += `
        <span class="toggle-spacer"></span>
        <input type="text" class="rename-input" value="${escapeHtml(item.name)}" data-id="${item.id}" />
        <button class="small save-rename-btn primary" data-level="${levelIndex}" data-id="${item.id}">Save</button>
        <button class="small cancel-btn" data-action="cancel">Cancel</button>
      `;
    } else if (isDeleting) {
      html += `
        <span class="toggle-spacer"></span>
        <span class="tree-name" style="color:var(--danger)">Delete "${escapeHtml(item.name)}"? Only works if nothing depends on it.</span>
        <button class="small confirm-delete-btn" data-level="${levelIndex}" data-id="${item.id}" style="background:var(--danger);color:white">Confirm Delete</button>
        <button class="small cancel-btn" data-action="cancel">Cancel</button>
      `;
    } else {
      html += `
        ${hasNextLevel
          ? `<button class="toggle" data-level="${levelIndex}" data-id="${item.id}">${isExpanded ? '▾' : '▸'}</button>`
          : '<span class="toggle-spacer"></span>'}
        <span class="tree-name">${escapeHtml(item.name)}</span>
        ${countryBadgeHtml(item)}
        ${canWrite() ? `
          <button class="small edit-btn" data-id="${item.id}">Rename</button>
          <button class="small countries-btn" data-level="${levelIndex}" data-id="${item.id}">Countries</button>
          <button class="small delete-btn" data-id="${item.id}">Delete</button>
        ` : ''}
      `;
    }
    html += '</div>';

    if (isAssigning) {
      html += countryChecklistHtml(levelIndex, item);
    }

    if (isExpanded) {
      html += await buildLevelHtml(levelIndex + 1, item.id);
      const nextLevel = LEVELS[levelIndex + 1];
      if (canWrite()) {
        html += `<div class="add-child">
          <input type="text" class="add-input" data-level="${levelIndex + 1}" data-parent="${item.id}" placeholder="New ${nextLevel.label.toLowerCase()} name" />
          <button class="add-btn" data-level="${levelIndex + 1}" data-parent="${item.id}">+ Add ${nextLevel.label}</button>
        </div>`;
      }
    }
    html += '</li>';
  }
  html += '</ul>';
  return html;
}

async function render() {
  document.getElementById('tree').innerHTML = await buildLevelHtml(0, null);
}

document.getElementById('tree').addEventListener('click', async (e) => {
  const toggleBtn = e.target.closest('.toggle');
  const editBtn = e.target.closest('.edit-btn');
  const deleteBtn = e.target.closest('.delete-btn');
  const countriesBtn = e.target.closest('.countries-btn');
  const addBtn = e.target.closest('.add-btn');
  const saveRenameBtn = e.target.closest('.save-rename-btn');
  const saveCountriesBtn = e.target.closest('.save-countries-btn');
  const confirmDeleteBtn = e.target.closest('.confirm-delete-btn');
  const cancelBtn = e.target.closest('.cancel-btn');

  if (toggleBtn) {
    const level = LEVELS[toggleBtn.dataset.level].key;
    const id = toggleBtn.dataset.id;
    if (expanded[level].has(id)) expanded[level].delete(id);
    else expanded[level].add(id);
    render();
    return;
  }

  if (editBtn) {
    editingId = editBtn.dataset.id;
    deletingId = null;
    assigningId = null;
    clearTreeError();
    render();
    return;
  }

  if (deleteBtn) {
    deletingId = deleteBtn.dataset.id;
    editingId = null;
    assigningId = null;
    clearTreeError();
    render();
    return;
  }

  if (countriesBtn) {
    assigningId = countriesBtn.dataset.id;
    editingId = null;
    deletingId = null;
    clearTreeError();
    render();
    return;
  }

  if (cancelBtn) {
    editingId = null;
    deletingId = null;
    assigningId = null;
    render();
    return;
  }

  if (saveCountriesBtn) {
    const levelIndex = Number(saveCountriesBtn.dataset.level);
    const level = LEVELS[levelIndex];
    const id = saveCountriesBtn.dataset.id;
    const checked = [...document.querySelectorAll(`.country-checklist[data-id="${id}"] .country-check:checked`)]
      .map((el) => el.value);
    try {
      const res = await authedFetch(level.countriesPath(id), { method: 'PUT', body: JSON.stringify({ countryIds: checked }) });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Save failed');
      assigningId = null;
      cache.clear();
      clearTreeError();
      render();
    } catch (err) {
      showTreeError('Saving countries failed: ' + err.message);
    }
    return;
  }

  if (saveRenameBtn) {
    const levelIndex = Number(saveRenameBtn.dataset.level);
    const level = LEVELS[levelIndex];
    const id = saveRenameBtn.dataset.id;
    const input = document.querySelector(`.rename-input[data-id="${id}"]`);
    const newName = input.value.trim();
    if (!newName) return;
    try {
      const res = await authedFetch(level.itemPath(id), { method: 'PATCH', body: JSON.stringify({ name: newName }) });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Rename failed');
      editingId = null;
      cache.clear();
      clearTreeError();
      render();
    } catch (err) {
      showTreeError('Rename failed: ' + err.message);
    }
    return;
  }

  if (confirmDeleteBtn) {
    const levelIndex = Number(confirmDeleteBtn.dataset.level);
    const level = LEVELS[levelIndex];
    const id = confirmDeleteBtn.dataset.id;
    try {
      const res = await authedFetch(level.itemPath(id), { method: 'DELETE' });
      if (!res.ok) {
        const data = await res.json();
        throw new Error(data.error || 'Delete failed');
      }
      deletingId = null;
      cache.clear();
      clearTreeError();
      render();
    } catch (err) {
      showTreeError('Delete failed: ' + err.message);
    }
    return;
  }

  if (addBtn) {
    const levelIndex = Number(addBtn.dataset.level);
    const level = LEVELS[levelIndex];
    const parentId = addBtn.dataset.parent;
    const input = document.querySelector(`.add-input[data-level="${levelIndex}"][data-parent="${parentId}"]`);
    const name = input.value.trim();
    if (!name) return;
    try {
      const res = await authedFetch(level.createPath, {
        method: 'POST',
        body: JSON.stringify(level.createBody(parentId, name)),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Add failed');
      expanded[level.key] = expanded[level.key] || new Set();
      if (levelIndex > 0) expanded[LEVELS[levelIndex - 1].key].add(parentId);
      cache.delete(`${level.key}:${parentId}`);
      clearTreeError();
      render();
    } catch (err) {
      showTreeError('Add failed: ' + err.message);
    }
  }
});

document.getElementById('top-add-btn').addEventListener('click', async () => {
  const input = document.getElementById('top-add-input');
  const name = input.value.trim();
  if (!name) return;
  try {
    const res = await authedFetch('/master/crops', { method: 'POST', body: JSON.stringify({ name }) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Add failed');
    input.value = '';
    cache.delete('crop:null');
    clearTreeError();
    render();
  } catch (err) {
    showTreeError('Add failed: ' + err.message);
  }
});

async function init() {
  currentUser = await initAdminPage();
  if (!currentUser) return;
  if (currentUser.role !== 'admin' && currentUser.role !== 'super_admin') {
    document.querySelector('.panel').innerHTML = '<p class="error">Only Admin and Super Admin can access Crops & Varieties.</p>';
    return;
  }

  const countriesRes = await authedFetch('/locations/countries');
  const countriesData = await countriesRes.json();
  allCountries = countriesData.countries;
  countryNameById = new Map(allCountries.map((c) => [c.id, c.name]));

  const scopeNote = document.getElementById('scope-note');
  if (currentUser.role === 'admin') {
    scopeNote.textContent = 'Crops and Varieties are managed by Super Admin only. You can view the list here.';
  } else {
    scopeNote.textContent = 'As Super Admin, you manage the global Crop and Variety list.';
    document.getElementById('top-add').style.display = 'flex';
  }

  render();
}

init();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Pending User Approvals</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; color: #1a1a1a; }
  h1 { font-size: 1.4rem; }
  table { width: 100%; border-collapse: collapse; margin-top: 20px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #e2e2e2; font-size: 0.95rem; }
  th { color: #666; font-weight: 600; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.04em; }
  .role-badge { background: #eef2ff; color: #3730a3; padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; }
  button { padding: 6px 14px; border-radius: 6px; border: none; cursor: pointer; font-size: 0.85rem; margin-right: 6px; }
  .approve { background: #16a34a; color: white; }
  .reject { background: #dc2626; color: white; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .empty { color: #888; margin-top: 30px; }
  .error { color: #dc2626; margin-top: 10px; }

  .header-bar { display: flex; justify-content: space-between; align-items: center; }
  .who { font-size: 0.85rem; color: #555; }
  .who button { background: none; border: 1px solid #ccc; color: #333; margin-left: 10px; }

  .login-wrap { max-width: 340px; margin: 80px auto; }
  .login-wrap label { display: block; font-size: 13px; color: #555; margin: 12px 0 4px; }
  .login-wrap input { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
  .login-wrap button { width: 100%; margin-top: 20px; padding: 10px; background: #2563eb; color: #fff; font-size: 15px; }
</style>
</head>
<body>

<div id="login-view" class="login-wrap" style="display:none">
  <h1>Admin Login</h1>
  <label>Email or Mobile</label>
  <input id="login-identifier" type="text" autocomplete="username" />
  <label>Password</label>
  <input id="login-password" type="password" autocomplete="current-password" />
  <p id="login-error" class="error" style="display:none"></p>
  <button id="login-submit">Log In</button>
</div>

<div id="app-view" style="display:none">
  <div class="header-bar">
    <h1>Pending User Approvals</h1>
    <div class="who">
      Logged in as <strong id="me-name"></strong>
      <button id="logout-btn">Log out</button>
    </div>
  </div>
  <p id="status" class="empty">Loading...</p>
  <table id="table" style="display:none">
    <thead>
      <tr><th>ID</th><th>Name</th><th>Contact</th><th>Role</th><th>Requested</th><th>Action</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
</div>

<script>
const ROLE_LABELS = {
  tfo: 'Extension Agent (TFO)',
  supervisor: 'Supervisor',
  team_lead: 'Team Lead',
  country_manager: 'Country Manager',
  admin: 'Admin',
  super_admin: 'Super Admin',
};

const ASSIGNABLE_ROLES = ['tfo', 'supervisor', 'team_lead', 'country_manager', 'admin'];

function getToken() {
  return localStorage.getItem('admin_token');
}
function setToken(token) {
  localStorage.setItem('admin_token', token);
}
function clearToken() {
  localStorage.removeItem('admin_token');
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function authedFetch(path, options = {}) {
  const res = await fetch(path, {
    ...options,
    headers: { ...(options.headers || {}), Authorization: `Bearer ${getToken()}` },
  });
  if (res.status === 401) {
    clearToken();
    showLogin();
    throw new Error('Session expired, please log in again');
  }
  return res;
}

function showLogin() {
  document.getElementById('login-view').style.display = 'block';
  document.getElementById('app-view').style.display = 'none';
}

function showApp() {
  document.getElementById('login-view').style.display = 'none';
  document.getElementById('app-view').style.display = 'block';
}

async function init() {
  if (!getToken()) {
    showLogin();
    return;
  }
  try {
    const res = await authedFetch('/admin/me');
    const data = await res.json();
    document.getElementById('me-name').textContent = data.user.name;
    showApp();
    loadPending();
  } catch {
    // authedFetch already redirected to login
  }
}

document.getElementById('login-submit').addEventListener('click', async () => {
  const identifier = document.getElementById('login-identifier').value.trim();
  const password = document.getElementById('login-password').value;
  const errorEl = document.getElementById('login-error');
  errorEl.style.display = 'none';

  try {
    const res = await fetch('/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ identifier, password }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Login failed');
    if (data.user.role !== 'admin' && data.user.role !== 'super_admin') {
      throw new Error('This account does not have admin access');
    }
    setToken(data.token);
    init();
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.style.display = 'block';
  }
});

document.getElementById('logout-btn').addEventListener('click', () => {
  clearToken();
  showLogin();
});

async function loadPending() {
  const statusEl = document.getElementById('status');
  const table = document.getElementById('table');
  const rows = document.getElementById('rows');

  try {
    const res = await authedFetch('/admin/users/pending');
    const data = await res.json();

    if (!data.users.length) {
      statusEl.textContent = 'No pending users right now.';
      statusEl.className = 'empty';
      statusEl.style.display = 'block';
      table.style.display = 'none';
      return;
    }

    statusEl.style.display = 'none';
    table.style.display = 'table';
    rows.innerHTML = '';

    for (const user of data.users) {
      const tr = document.createElement('tr');
      const contact = user.email || user.mobile_number;
      const requested = new Date(user.created_at).toLocaleString();
      const roleOptions = ASSIGNABLE_ROLES
        .map((value) => `<option value="${value}" ${value === user.role ? 'selected' : ''}>${ROLE_LABELS[value]}</option>`)
        .join('');
      tr.innerHTML = `
        <td><code>${escapeHtml(user.user_code)}</code></td>
        <td>${escapeHtml(user.name)}</td>
        <td>${escapeHtml(contact)}</td>
        <td><select class="role-select" data-user-id="${user.id}">${roleOptions}</select></td>
        <td>${requested}</td>
        <td>
          <button class="approve" data-id="${user.id}" data-action="approve">Approve</button>
          <button class="reject" data-id="${user.id}" data-action="reject">Reject</button>
        </td>
      `;
      rows.appendChild(tr);
    }
  } catch (err) {
    if (err.message.includes('expired')) return;
    statusEl.textContent = 'Failed to load pending users: ' + err.message;
    statusEl.className = 'error';
    statusEl.style.display = 'block';
  }
}

document.getElementById('rows').addEventListener('click', async (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  const { id, action } = btn.dataset;
  btn.disabled = true;
  try {
    const body = {};
    if (action === 'approve') {
      const select = document.querySelector(`.role-select[data-user-id="${id}"]`);
      if (select) body.role = select.value;
    }
    const res = await authedFetch(`/admin/users/${id}/${action}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!res.ok) {
      const data = await res.json();
      alert('Failed: ' + (data.error || res.statusText));
      btn.disabled = false;
      return;
    }
    loadPending();
  } catch (err) {
    alert('Failed: ' + err.message);
    btn.disabled = false;
  }
});

init();
</script>
</body>
</html>

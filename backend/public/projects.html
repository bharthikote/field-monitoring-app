<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Projects</title>
<link rel="stylesheet" href="/admin.css" />
<style>
  #new-project-panel { display: none; margin: 16px 0 24px; padding: 18px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); }
  #new-project-panel label { display: block; font-size: 13px; color: var(--text-muted); margin: 12px 0 6px; }
  #new-project-panel .field-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 16px; max-width: 900px; }
  #new-project-panel .field-grid.wide { grid-template-columns: 1fr; max-width: 900px; }
  #new-project-panel input, #new-project-panel select, #new-project-panel textarea { width: 100%; font-family: inherit; }
  #new-project-panel textarea { padding: 8px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border-strong); font-size: 0.85rem; resize: vertical; }
  .status-badge { padding: 3px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
  .status-ongoing { background: #dcfce7; color: #166534; }
  .status-completed { background: #dbeafe; color: #1e40af; }
  .status-terminated { background: #fee2e2; color: #991b1b; }
  .pagination-row { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; }
  .per-page-select { width: auto; display: inline-block; }
  .page-buttons { display: flex; gap: 4px; align-items: center; }
  .page-buttons button { min-width: 32px; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; }
  .page-buttons button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .page-buttons button:disabled { opacity: 0.4; cursor: default; }
</style>
</head>
<body>

<div id="admin-nav"></div>

<div class="page page-wide">
<div class="panel">
<div class="report-header">
  <div>
    <h1>Project</h1>
    <p class="scope-note" style="margin-top:0" id="entries-summary"></p>
  </div>
  <div class="inline-form">
    <button id="new-project-btn" class="primary">+ Add Project</button>
  </div>
</div>

<div id="new-project-panel">
  <p id="panel-title" style="font-weight:600; margin:0"></p>
  <div class="field-grid wide">
    <div><label>Project Title *</label><input type="text" id="f-title" /></div>
  </div>
  <div class="field-grid wide">
    <div><label>Description</label><textarea id="f-description" rows="2"></textarea></div>
  </div>
  <div class="field-grid">
    <div><label>Country *</label><select id="f-country"></select></div>
    <div><label>Start Date *</label><input type="date" id="f-start-date" /></div>
    <div><label>End Date *</label><input type="date" id="f-end-date" /></div>
  </div>
  <div class="field-grid">
    <div><label>Target Farmer Trained</label><input type="number" min="0" id="f-target-farmer" /></div>
    <div><label>Target Key Farmer Trained</label><input type="number" min="0" id="f-target-key-farmer" /></div>
    <div><label>Target Core Farmer Trained</label><input type="number" min="0" id="f-target-core-farmer" /></div>
  </div>
  <div class="field-grid">
    <div><label>Target Demo</label><input type="number" min="0" id="f-target-demo" /></div>
    <div><label>Target Knowledge Acquisition</label><input type="number" min="0" id="f-target-knowledge" /></div>
  </div>
  <p id="form-error" class="error" style="display:none; margin-top:12px;"></p>
  <div class="form-actions" style="margin-top:16px; display:flex; gap:8px;">
    <button id="save-project-btn" class="primary">Save Project</button>
    <button id="cancel-project-btn" style="background:var(--surface);border:1px solid var(--border-strong);color:var(--text)">Cancel</button>
  </div>
</div>

<div class="inline-form" style="margin-bottom: 4px;">
  <div class="search-wrap">
    <input type="text" id="search-input" placeholder="Search by project title..." />
    <span class="search-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
  </div>
  <select id="status-filter" style="max-width:180px">
    <option value="">All statuses</option>
    <option value="ongoing">Ongoing</option>
    <option value="completed">Completed</option>
    <option value="terminated">Terminated</option>
  </select>
</div>

<p id="status" class="empty">Loading...</p>
<div class="table-scroll">
<table id="table" style="display:none">
  <thead>
    <tr>
      <th>#</th>
      <th>Project Title</th>
      <th>Country</th>
      <th>Project Status</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody id="rows"></tbody>
</table>
</div>

<div class="pagination-row" id="pagination-row" style="display:none">
  <div>
    <select id="per-page-select" class="per-page-select">
      <option value="10">10</option>
      <option value="25">25</option>
      <option value="50">50</option>
    </select>
    <span class="scope-note">entries per page</span>
  </div>
  <div class="page-buttons" id="page-buttons"></div>
</div>

</div>
</div>

<script src="/admin-shared.js"></script>
<script>
const DELETE_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';
const EDIT_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>';
const EYE_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>';

let allProjects = [];
let allCountries = [];
let searchQuery = '';
let statusFilter = '';
let perPage = 10;
let currentPage = 1;
let editingProjectId = null; // null = creating new

async function loadCountries() {
  const res = await authedFetch('/locations/countries');
  allCountries = (await res.json()).countries;
  document.getElementById('f-country').innerHTML = allCountries.map((c) => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
}

async function loadProjects() {
  const statusEl = document.getElementById('status');
  try {
    const res = await authedFetch('/projects');
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed to load projects');
    allProjects = data.projects;
    currentPage = 1;
    render();
  } catch (err) {
    if (err.message.includes('expired')) return;
    statusEl.textContent = 'Failed to load projects: ' + err.message;
    statusEl.className = 'error';
    statusEl.style.display = 'block';
  }
}

function getVisibleProjects() {
  let visible = allProjects;
  if (searchQuery.trim()) {
    const q = searchQuery.trim().toLowerCase();
    visible = visible.filter((p) => p.title.toLowerCase().includes(q));
  }
  if (statusFilter) visible = visible.filter((p) => p.status === statusFilter);
  return visible;
}

function render() {
  const statusEl = document.getElementById('status');
  const table = document.getElementById('table');
  const rows = document.getElementById('rows');
  const paginationRow = document.getElementById('pagination-row');
  const visible = getVisibleProjects();

  if (!allProjects.length) {
    statusEl.textContent = 'No projects yet - create one to get started.';
    statusEl.className = 'empty';
    statusEl.style.display = 'block';
    table.style.display = 'none';
    paginationRow.style.display = 'none';
    document.getElementById('entries-summary').textContent = '';
    return;
  }
  if (!visible.length) {
    statusEl.textContent = 'No projects match your search/filter.';
    statusEl.className = 'empty';
    statusEl.style.display = 'block';
    table.style.display = 'none';
    paginationRow.style.display = 'none';
    return;
  }

  const totalPages = Math.max(1, Math.ceil(visible.length / perPage));
  if (currentPage > totalPages) currentPage = totalPages;
  const start = (currentPage - 1) * perPage;
  const pageItems = visible.slice(start, start + perPage);

  statusEl.style.display = 'none';
  table.style.display = 'table';
  paginationRow.style.display = 'flex';
  document.getElementById('entries-summary').textContent =
    `Showing ${start + 1} to ${Math.min(start + perPage, visible.length)} of ${visible.length} entries.`;

  rows.innerHTML = pageItems.map((p, i) => `
    <tr>
      <td>${start + i + 1}</td>
      <td>${escapeHtml(p.title)}</td>
      <td>${escapeHtml(p.country_name)}</td>
      <td><span class="status-badge status-${p.status}">${p.status}</span></td>
      <td>
        <div class="actions-cell">
          <a href="/admin/projects/${p.id}" class="btn edit-btn">${EYE_ICON} Preview</a>
          <button class="btn edit-btn edit-project-btn" data-id="${p.id}">${EDIT_ICON} Edit</button>
          <button class="btn delete-btn delete-project-btn" data-id="${p.id}">${DELETE_ICON} Delete</button>
        </div>
      </td>
    </tr>
  `).join('');

  const buttons = document.getElementById('page-buttons');
  let html = `<button data-page="${currentPage - 1}" ${currentPage === 1 ? 'disabled' : ''}>&lt;</button>`;
  for (let i = 1; i <= totalPages; i++) {
    if (totalPages > 7 && i !== 1 && i !== totalPages && Math.abs(i - currentPage) > 1) {
      if (i === 2 || i === totalPages - 1) html += `<span>…</span>`;
      continue;
    }
    html += `<button data-page="${i}" class="${i === currentPage ? 'active' : ''}">${i}</button>`;
  }
  html += `<button data-page="${currentPage + 1}" ${currentPage === totalPages ? 'disabled' : ''}>&gt;</button>`;
  buttons.innerHTML = html;
}

document.getElementById('page-buttons').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-page]');
  if (!btn || btn.disabled) return;
  currentPage = Number(btn.dataset.page);
  render();
});
document.getElementById('per-page-select').addEventListener('change', (e) => {
  perPage = Number(e.target.value);
  currentPage = 1;
  render();
});
document.getElementById('search-input').addEventListener('input', (e) => {
  searchQuery = e.target.value;
  currentPage = 1;
  render();
});
document.getElementById('status-filter').addEventListener('change', (e) => {
  statusFilter = e.target.value;
  currentPage = 1;
  render();
});

function clearForm() {
  document.getElementById('f-title').value = '';
  document.getElementById('f-description').value = '';
  document.getElementById('f-country').value = allCountries[0]?.id || '';
  document.getElementById('f-start-date').value = '';
  document.getElementById('f-end-date').value = '';
  document.getElementById('f-target-farmer').value = '';
  document.getElementById('f-target-key-farmer').value = '';
  document.getElementById('f-target-core-farmer').value = '';
  document.getElementById('f-target-demo').value = '';
  document.getElementById('f-target-knowledge').value = '';
}

function openPanel(project) {
  editingProjectId = project ? project.id : null;
  document.getElementById('panel-title').textContent = project ? `Editing "${project.title}"` : 'New Project';
  clearForm();
  if (project) {
    document.getElementById('f-title').value = project.title;
    document.getElementById('f-description').value = project.description || '';
    document.getElementById('f-country').value = project.country_id;
    document.getElementById('f-start-date').value = project.start_date;
    document.getElementById('f-end-date').value = project.end_date;
    document.getElementById('f-target-farmer').value = project.target_farmer_trained ?? '';
    document.getElementById('f-target-key-farmer').value = project.target_key_farmer_trained ?? '';
    document.getElementById('f-target-core-farmer').value = project.target_core_farmer_trained ?? '';
    document.getElementById('f-target-demo').value = project.target_demo ?? '';
    document.getElementById('f-target-knowledge').value = project.target_knowledge_acquisition ?? '';
  }
  document.getElementById('form-error').style.display = 'none';
  document.getElementById('new-project-panel').style.display = 'block';
  document.getElementById('f-title').focus();
}
function closePanel() {
  editingProjectId = null;
  document.getElementById('new-project-panel').style.display = 'none';
}

document.getElementById('new-project-btn').addEventListener('click', () => openPanel(null));
document.getElementById('cancel-project-btn').addEventListener('click', closePanel);

document.getElementById('save-project-btn').addEventListener('click', async () => {
  const errorEl = document.getElementById('form-error');
  errorEl.style.display = 'none';

  const body = {
    title: document.getElementById('f-title').value.trim(),
    description: document.getElementById('f-description').value.trim(),
    countryId: document.getElementById('f-country').value,
    startDate: document.getElementById('f-start-date').value,
    endDate: document.getElementById('f-end-date').value,
    targetFarmerTrained: document.getElementById('f-target-farmer').value || null,
    targetKeyFarmerTrained: document.getElementById('f-target-key-farmer').value || null,
    targetCoreFarmerTrained: document.getElementById('f-target-core-farmer').value || null,
    targetDemo: document.getElementById('f-target-demo').value || null,
    targetKnowledgeAcquisition: document.getElementById('f-target-knowledge').value || null,
  };

  const btn = document.getElementById('save-project-btn');
  btn.disabled = true;
  try {
    const path = editingProjectId ? `/projects/${editingProjectId}` : '/projects';
    const method = editingProjectId ? 'PATCH' : 'POST';
    const res = await authedFetch(path, { method, body: JSON.stringify(body) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed to save project');
    closePanel();
    await loadProjects();
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.style.display = 'block';
  } finally {
    btn.disabled = false;
  }
});

document.getElementById('rows').addEventListener('click', async (e) => {
  const editBtn = e.target.closest('.edit-project-btn');
  const deleteBtn = e.target.closest('.delete-project-btn');

  if (editBtn) {
    editBtn.disabled = true;
    try {
      const res = await authedFetch(`/projects/${editBtn.dataset.id}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Failed to load project');
      openPanel(data.project);
    } catch (err) {
      alert(err.message);
    } finally {
      editBtn.disabled = false;
    }
    return;
  }
  if (deleteBtn) {
    if (!confirm('Delete this project? This can\'t be undone.')) return;
    deleteBtn.disabled = true;
    try {
      const res = await authedFetch(`/projects/${deleteBtn.dataset.id}`, { method: 'DELETE' });
      if (!res.ok && res.status !== 204) {
        const data = await res.json();
        throw new Error(data.error || 'Failed to delete project');
      }
      await loadProjects();
    } catch (err) {
      alert(err.message);
      deleteBtn.disabled = false;
    }
  }
});

async function init() {
  const user = await initAdminPage();
  if (!user) return;
  if (user.role !== 'super_admin') {
    document.querySelector('.panel').innerHTML = '<p class="error">Only Super Admin can manage Projects.</p>';
    return;
  }
  await loadCountries();
  await loadProjects();

  const editId = new URLSearchParams(location.search).get('edit');
  if (editId) {
    const project = allProjects.find((p) => p.id === editId);
    if (project) {
      const res = await authedFetch(`/projects/${editId}`);
      if (res.ok) openPanel((await res.json()).project);
    }
    history.replaceState(null, '', '/admin/projects');
  }
}

init();
</script>
</body>
</html>

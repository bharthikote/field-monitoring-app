<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Activity Items</title>
<link rel="stylesheet" href="/admin.css" />
<style>
  #item-panel { display: none; margin: 16px 0 24px; padding: 18px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); }
  #item-panel label { display: block; font-size: 13px; color: var(--text-muted); margin: 14px 0 6px; }
  #item-panel label:first-child { margin-top: 0; }
  #item-panel input, #item-panel textarea { width: 100%; max-width: 460px; font-family: inherit; }
  #item-panel textarea { padding: 8px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border-strong); font-size: 0.85rem; resize: vertical; }
  .checklist { display: flex; flex-wrap: wrap; gap: 8px 18px; max-width: 640px; }
  .checklist label { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; cursor: pointer; font-weight: 400; margin: 0; }
  .chip-list { display: flex; flex-wrap: wrap; gap: 4px; max-width: 320px; }
  .chip { background: var(--bg); border: 1px solid var(--border); border-radius: 999px; padding: 2px 9px; font-size: 0.78rem; white-space: nowrap; }
</style>
</head>
<body>

<div id="admin-nav"></div>

<div class="page page-wide">
<div class="panel">
<p><a href="/admin/activity-costs" style="color:var(--text-muted); font-size:0.85rem; text-decoration:none;">&larr; Back to Activity Costs</a></p>
<h1 id="activity-heading">Loading…</h1>
<p id="load-error" class="error" style="display:none"></p>

<div id="content" style="display:none">

<button id="add-item-btn" class="primary" style="margin-bottom:16px">+ Add Item</button>

<div id="item-panel">
  <p id="item-panel-title" style="font-weight:600; margin:0"></p>
  <label>Item Name</label>
  <input type="text" id="item-name" placeholder="e.g. Labour" />

  <label>Country</label>
  <div class="checklist" id="item-countries"></div>

  <label>Unit</label>
  <div class="checklist" id="item-units"></div>

  <label>Remark</label>
  <textarea id="item-remark" rows="2" placeholder="Optional"></textarea>

  <p id="item-error" class="error" style="display:none"></p>
  <div class="form-actions" style="margin-top:16px; display:flex; gap:8px;">
    <button id="item-save" class="primary">Save Item</button>
    <button id="item-cancel" style="background:var(--surface);border:1px solid var(--border-strong);color:var(--text)">Cancel</button>
  </div>
</div>

<p id="items-status" class="empty">Loading…</p>
<div class="table-scroll">
<table id="items-table" style="display:none">
  <thead>
    <tr>
      <th>Item</th>
      <th>Country</th>
      <th>Unit</th>
      <th>Remark</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody id="items-rows"></tbody>
</table>
</div>

</div>
</div>
</div>

<script src="/admin-shared.js"></script>
<script>
const activityId = location.pathname.split('/').pop();
const DELETE_ICON = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';
const EDIT_ICON = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>';

let currentActivity = null;
let currentItems = [];
let allCountries = [];
let allUnits = [];
let editingItemId = null; // null = creating new

function countryChecklistHtml(selectedIds) {
  const selected = new Set(selectedIds || []);
  return allCountries.map((c) => `
    <label><input type="checkbox" class="item-country-check" value="${c.id}" ${selected.has(c.id) ? 'checked' : ''} /> ${escapeHtml(c.name)}</label>
  `).join('');
}
function unitChecklistHtml(selectedIds) {
  const selected = new Set(selectedIds || []);
  return allUnits.map((u) => `
    <label><input type="checkbox" class="item-unit-check" value="${u.id}" ${selected.has(u.id) ? 'checked' : ''} /> ${escapeHtml(u.name)}</label>
  `).join('');
}

function openItemPanel(item) {
  editingItemId = item ? item.id : null;
  document.getElementById('item-panel-title').textContent = item ? `Editing "${item.name}"` : 'New Item';
  document.getElementById('item-name').value = item ? item.name : '';
  document.getElementById('item-remark').value = item ? (item.remark || '') : '';
  document.getElementById('item-countries').innerHTML = countryChecklistHtml(item ? item.country_ids : []);
  document.getElementById('item-units').innerHTML = unitChecklistHtml(item ? item.units.map((u) => u.id) : []);
  document.getElementById('item-error').style.display = 'none';
  document.getElementById('item-panel').style.display = 'block';
  document.getElementById('item-name').focus();
}
function closeItemPanel() {
  editingItemId = null;
  document.getElementById('item-panel').style.display = 'none';
}

async function loadActivity() {
  const res = await authedFetch(`/activities/${activityId}`);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Failed to load activity');
  currentActivity = data.activity;
  currentItems = data.items;
}

function renderItems() {
  const statusEl = document.getElementById('items-status');
  const table = document.getElementById('items-table');
  const rows = document.getElementById('items-rows');

  if (!currentItems.length) {
    statusEl.textContent = 'No items yet - add one to get started.';
    statusEl.style.display = 'block';
    table.style.display = 'none';
    return;
  }
  statusEl.style.display = 'none';
  table.style.display = 'table';

  rows.innerHTML = currentItems.map((item) => {
    const countryNames = item.country_ids.map((id) => allCountries.find((c) => c.id === id)?.name || '?');
    return `
      <tr>
        <td>${escapeHtml(item.name)}</td>
        <td><div class="chip-list">${countryNames.map((n) => `<span class="chip">${escapeHtml(n)}</span>`).join('')}</div></td>
        <td><div class="chip-list">${item.units.map((u) => `<span class="chip">${escapeHtml(u.name)}</span>`).join('')}</div></td>
        <td>${escapeHtml(item.remark || '—')}</td>
        <td>
          <div class="actions-cell">
            <button class="btn edit-btn edit-item-btn" data-id="${item.id}">${EDIT_ICON} Edit</button>
            <button class="btn delete-btn delete-item-btn" data-id="${item.id}">${DELETE_ICON} Delete</button>
          </div>
        </td>
      </tr>
    `;
  }).join('');
}

document.getElementById('add-item-btn').addEventListener('click', () => openItemPanel(null));
document.getElementById('item-cancel').addEventListener('click', closeItemPanel);

document.getElementById('item-save').addEventListener('click', async () => {
  const errorEl = document.getElementById('item-error');
  errorEl.style.display = 'none';
  const name = document.getElementById('item-name').value.trim();
  const remark = document.getElementById('item-remark').value.trim();
  const countryIds = [...document.querySelectorAll('.item-country-check:checked')].map((el) => el.value);
  const unitIds = [...document.querySelectorAll('.item-unit-check:checked')].map((el) => el.value);

  if (!name) {
    errorEl.textContent = 'Item name is required.';
    errorEl.style.display = 'block';
    return;
  }
  if (countryIds.length === 0) {
    errorEl.textContent = 'Select at least one country.';
    errorEl.style.display = 'block';
    return;
  }
  if (unitIds.length === 0) {
    errorEl.textContent = 'Select at least one unit.';
    errorEl.style.display = 'block';
    return;
  }

  const btn = document.getElementById('item-save');
  btn.disabled = true;
  try {
    const path = editingItemId ? `/activity-items/${editingItemId}` : `/activities/${activityId}/items`;
    const method = editingItemId ? 'PATCH' : 'POST';
    const res = await authedFetch(path, { method, body: JSON.stringify({ name, countryIds, unitIds, remark }) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed to save item');
    closeItemPanel();
    await loadActivity();
    renderItems();
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.style.display = 'block';
  } finally {
    btn.disabled = false;
  }
});

document.getElementById('items-rows').addEventListener('click', async (e) => {
  const editBtn = e.target.closest('.edit-item-btn');
  const deleteBtn = e.target.closest('.delete-item-btn');

  if (editBtn) {
    const item = currentItems.find((i) => i.id === editBtn.dataset.id);
    openItemPanel(item);
    return;
  }
  if (deleteBtn) {
    if (!confirm('Delete this item? This can\'t be undone.')) return;
    deleteBtn.disabled = true;
    try {
      const res = await authedFetch(`/activity-items/${deleteBtn.dataset.id}`, { method: 'DELETE' });
      if (!res.ok && res.status !== 204) {
        const data = await res.json();
        throw new Error(data.error || 'Failed to delete item');
      }
      await loadActivity();
      renderItems();
    } catch (err) {
      alert(err.message);
      deleteBtn.disabled = false;
    }
  }
});

async function init() {
  const user = await initAdminPage();
  if (!user) return;
  if (user.role !== 'super_admin') {
    document.querySelector('.panel').innerHTML = '<p class="error">Only Super Admin can manage Activity Costs.</p>';
    return;
  }
  try {
    const [countriesRes, unitsRes] = await Promise.all([
      authedFetch('/locations/countries'),
      authedFetch('/master/units'),
    ]);
    allCountries = (await countriesRes.json()).countries;
    allUnits = (await unitsRes.json()).items;

    await loadActivity();
    document.getElementById('activity-heading').textContent = currentActivity.name;
    renderItems();
    document.getElementById('content').style.display = 'block';
  } catch (err) {
    document.getElementById('load-error').textContent = err.message;
    document.getElementById('load-error').style.display = 'block';
    document.getElementById('activity-heading').textContent = 'Activity';
  }
}

init();
</script>
</body>
</html>

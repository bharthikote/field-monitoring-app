<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Data Collection Forms</title>
<link rel="stylesheet" href="/admin.css" />
<style>
  #new-form-panel { display: none; margin: 16px 0 24px; padding: 18px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); }
  #new-form-panel label { display: block; font-size: 13px; color: var(--text-muted); margin: 12px 0 6px; }
  #new-form-panel label:first-child { margin-top: 0; }
  #new-form-panel input, #new-form-panel textarea { width: 100%; max-width: 460px; font-family: inherit; }
  #new-form-panel textarea { padding: 8px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border-strong); font-size: 0.85rem; resize: vertical; }
  .form-actions { margin-top: 16px; display: flex; gap: 8px; }
</style>
</head>
<body>

<div id="admin-nav"></div>

<div class="page page-wide">
<div class="panel">
<div class="report-header">
  <div>
    <h1>Data Collection Forms</h1>
    <p class="scope-note" style="margin-top:0">Build custom forms and assign them to Data Enumerators to fill out against farmer profiles.</p>
  </div>
  <button id="new-form-btn" class="primary">+ New Form</button>
</div>

<div id="new-form-panel">
  <label>Title</label>
  <input type="text" id="new-form-title" placeholder="e.g. Household Baseline Survey" />
  <label>Description</label>
  <textarea id="new-form-description" rows="2" placeholder="Optional"></textarea>
  <p id="new-form-error" class="error" style="display:none"></p>
  <div class="form-actions">
    <button id="new-form-create" class="primary">Create Form</button>
    <button id="new-form-cancel" style="background:var(--surface);border:1px solid var(--border-strong);color:var(--text)">Cancel</button>
  </div>
</div>

<p id="status" class="empty">Loading...</p>
<div class="table-scroll">
<table id="table" style="display:none">
  <thead>
    <tr>
      <th>Title</th>
      <th>Description</th>
      <th>Fields</th>
      <th>Assigned</th>
      <th>Submissions</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody id="rows"></tbody>
</table>
</div>
</div>
</div>

<script src="/admin-shared.js"></script>
<script>
const DELETE_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';
const EDIT_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>';

let allForms = [];

async function loadForms() {
  const statusEl = document.getElementById('status');
  try {
    const res = await authedFetch('/data-collection-forms');
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed to load forms');
    allForms = data.forms;
    render();
  } catch (err) {
    if (err.message.includes('expired')) return;
    statusEl.textContent = 'Failed to load forms: ' + err.message;
    statusEl.className = 'error';
    statusEl.style.display = 'block';
  }
}

function render() {
  const statusEl = document.getElementById('status');
  const table = document.getElementById('table');
  const rows = document.getElementById('rows');

  if (!allForms.length) {
    statusEl.textContent = 'No forms yet - create one to get started.';
    statusEl.className = 'empty';
    statusEl.style.display = 'block';
    table.style.display = 'none';
    return;
  }

  statusEl.style.display = 'none';
  table.style.display = 'table';
  rows.innerHTML = allForms.map((f) => `
    <tr>
      <td>${escapeHtml(f.title)}</td>
      <td>${escapeHtml(f.description || '—')}</td>
      <td>${f.field_count}</td>
      <td>${f.assignment_count}</td>
      <td>${f.submission_count}</td>
      <td>
        <div class="actions-cell">
          <a href="/admin/data-collection-forms/${f.id}" class="btn edit-btn">${EDIT_ICON} Edit</a>
          <button class="btn delete-btn delete-form-btn" data-id="${f.id}" ${f.submission_count > 0 ? 'disabled title="Forms with submitted data can\'t be deleted"' : ''}>${DELETE_ICON} Delete</button>
        </div>
      </td>
    </tr>
  `).join('');
}

document.getElementById('new-form-btn').addEventListener('click', () => {
  document.getElementById('new-form-panel').style.display = 'block';
  document.getElementById('new-form-title').focus();
});
document.getElementById('new-form-cancel').addEventListener('click', () => {
  document.getElementById('new-form-panel').style.display = 'none';
  document.getElementById('new-form-title').value = '';
  document.getElementById('new-form-description').value = '';
  document.getElementById('new-form-error').style.display = 'none';
});
document.getElementById('new-form-create').addEventListener('click', async () => {
  const errorEl = document.getElementById('new-form-error');
  errorEl.style.display = 'none';
  const title = document.getElementById('new-form-title').value.trim();
  const description = document.getElementById('new-form-description').value.trim();
  if (!title) {
    errorEl.textContent = 'Title is required.';
    errorEl.style.display = 'block';
    return;
  }
  const btn = document.getElementById('new-form-create');
  btn.disabled = true;
  try {
    const res = await authedFetch('/data-collection-forms', { method: 'POST', body: JSON.stringify({ title, description }) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed to create form');
    window.location.href = `/admin/data-collection-forms/${data.form.id}`;
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.style.display = 'block';
    btn.disabled = false;
  }
});

document.getElementById('rows').addEventListener('click', async (e) => {
  const deleteBtn = e.target.closest('.delete-form-btn');
  if (!deleteBtn || deleteBtn.disabled) return;
  if (!confirm('Delete this form? This cannot be undone.')) return;
  deleteBtn.disabled = true;
  try {
    const res = await authedFetch(`/data-collection-forms/${deleteBtn.dataset.id}`, { method: 'DELETE' });
    if (!res.ok && res.status !== 204) {
      const data = await res.json();
      throw new Error(data.error || 'Failed to delete form');
    }
    await loadForms();
  } catch (err) {
    alert(err.message);
    deleteBtn.disabled = false;
  }
});

async function init() {
  const user = await initAdminPage();
  if (!user) return;
  if (user.role !== 'super_admin') {
    document.querySelector('.panel').innerHTML = '<p class="error">Only Super Admin can manage data collection forms.</p>';
    return;
  }
  await loadForms();
}

init();
</script>
</body>
</html>

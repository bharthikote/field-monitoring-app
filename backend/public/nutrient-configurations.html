<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Nutrient Configurations</title>
<link rel="stylesheet" href="/admin.css" />
<style>
  #config-panel { display: none; margin: 16px 0 24px; padding: 18px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); }
  #config-panel label { display: block; font-size: 13px; color: var(--text-muted); margin: 14px 0 6px; }
  #config-panel label:first-child { margin-top: 0; }
  #config-panel input[type=text] { width: 100%; max-width: 380px; }
  .component-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .component-row select { min-width: 180px; }
  .component-row input[type=number] { width: 100px; }
  .component-row .remove-component-btn { background: var(--surface); color: var(--danger); border: 1px solid var(--border-strong); padding: 6px 10px; }
  .component-row .remove-component-btn:hover { background: var(--danger-soft); border-color: var(--danger); }
  #add-component-btn { margin-top: 4px; background: var(--accent-soft); color: var(--accent-hover); border: 1px solid transparent; }
  #add-component-btn:hover { background: #d7ecdb; }
</style>
</head>
<body>

<div id="admin-nav"></div>

<div class="page page-wide">
<div class="panel">
<div class="report-header">
  <div>
    <h1>Nutrient Configurations</h1>
    <p class="scope-note" style="margin-top:0">Named nutrient compositions (e.g. Urea = 46% Nitrogen) that a nutrient Activity Item can reference.</p>
  </div>
  <button id="new-config-btn" class="primary">+ New Configuration</button>
</div>

<div id="config-panel">
  <p id="config-panel-title" style="font-weight:600; margin:0"></p>
  <label>Configuration Name</label>
  <input type="text" id="config-name" placeholder="e.g. Urea" />

  <label>Nutrient Components</label>
  <div id="components-list"></div>
  <button id="add-component-btn" type="button">+ Add Nutrient</button>

  <p id="config-error" class="error" style="display:none"></p>
  <div class="form-actions" style="margin-top:16px; display:flex; gap:8px;">
    <button id="config-save" class="primary">Save Configuration</button>
    <button id="config-cancel" style="background:var(--surface);border:1px solid var(--border-strong);color:var(--text)">Cancel</button>
  </div>
</div>

<p id="status" class="empty">Loading...</p>
<div class="table-scroll">
<table id="table" style="display:none">
  <thead>
    <tr>
      <th>Name</th>
      <th>Composition</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody id="rows"></tbody>
</table>
</div>
</div>
</div>

<script src="/admin-shared.js"></script>
<script>
const DELETE_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';
const EDIT_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>';

let allConfigs = [];
let allNutrients = [];
let editingConfigId = null; // null = creating new
let componentRowSeq = 0;

async function loadConfigs() {
  const statusEl = document.getElementById('status');
  try {
    const res = await authedFetch('/nutrient-configurations');
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed to load configurations');
    allConfigs = data.configurations;
    render();
  } catch (err) {
    if (err.message.includes('expired')) return;
    statusEl.textContent = 'Failed to load configurations: ' + err.message;
    statusEl.className = 'error';
    statusEl.style.display = 'block';
  }
}

function render() {
  const statusEl = document.getElementById('status');
  const table = document.getElementById('table');
  const rows = document.getElementById('rows');

  if (!allConfigs.length) {
    statusEl.textContent = 'No nutrient configurations yet - create one to get started.';
    statusEl.className = 'empty';
    statusEl.style.display = 'block';
    table.style.display = 'none';
    return;
  }
  statusEl.style.display = 'none';
  table.style.display = 'table';
  rows.innerHTML = allConfigs.map((c) => `
    <tr>
      <td>${escapeHtml(c.name)}</td>
      <td>${escapeHtml(c.composition_summary || '—')}</td>
      <td>
        <div class="actions-cell">
          <button class="btn edit-btn edit-config-btn" data-id="${c.id}">${EDIT_ICON} Edit</button>
          <button class="btn delete-btn delete-config-btn" data-id="${c.id}">${DELETE_ICON} Delete</button>
        </div>
      </td>
    </tr>
  `).join('');
}

function nutrientOptionsHtml(selectedId) {
  return allNutrients.map((n) => `<option value="${n.id}" ${n.id === selectedId ? 'selected' : ''}>${escapeHtml(n.name)}</option>`).join('');
}

function addComponentRow(nutrientId, percentage) {
  const rowId = `component-${componentRowSeq++}`;
  const row = document.createElement('div');
  row.className = 'component-row';
  row.dataset.rowId = rowId;
  row.innerHTML = `
    <select class="component-nutrient">${nutrientOptionsHtml(nutrientId)}</select>
    <input type="number" class="component-percentage" min="0" max="100" step="any" placeholder="%" value="${percentage ?? ''}" />
    <button type="button" class="btn remove-component-btn">Remove</button>
  `;
  document.getElementById('components-list').appendChild(row);
  enhanceAllSelects(row);
}

function openConfigPanel(config, components) {
  editingConfigId = config ? config.id : null;
  document.getElementById('config-panel-title').textContent = config ? `Editing "${config.name}"` : 'New Configuration';
  document.getElementById('config-name').value = config ? config.name : '';
  document.getElementById('components-list').innerHTML = '';
  if (components && components.length) {
    components.forEach((c) => addComponentRow(c.nutrient_id, c.percentage));
  } else {
    addComponentRow(null, '');
  }
  document.getElementById('config-error').style.display = 'none';
  document.getElementById('config-panel').style.display = 'block';
  document.getElementById('config-name').focus();
}
function closeConfigPanel() {
  editingConfigId = null;
  document.getElementById('config-panel').style.display = 'none';
}

document.getElementById('new-config-btn').addEventListener('click', () => openConfigPanel(null, null));
document.getElementById('config-cancel').addEventListener('click', closeConfigPanel);
document.getElementById('add-component-btn').addEventListener('click', () => addComponentRow(null, ''));

document.getElementById('components-list').addEventListener('click', (e) => {
  const removeBtn = e.target.closest('.remove-component-btn');
  if (!removeBtn) return;
  removeBtn.closest('.component-row').remove();
});

document.getElementById('config-save').addEventListener('click', async () => {
  const errorEl = document.getElementById('config-error');
  errorEl.style.display = 'none';
  const name = document.getElementById('config-name').value.trim();
  const components = [...document.querySelectorAll('.component-row')].map((row) => ({
    nutrientId: row.querySelector('.component-nutrient').value,
    percentage: row.querySelector('.component-percentage').value,
  }));

  if (!name) {
    errorEl.textContent = 'Configuration name is required.';
    errorEl.style.display = 'block';
    return;
  }
  if (components.length === 0) {
    errorEl.textContent = 'Add at least one nutrient component.';
    errorEl.style.display = 'block';
    return;
  }
  const nutrientIds = components.map((c) => c.nutrientId);
  if (new Set(nutrientIds).size !== nutrientIds.length) {
    errorEl.textContent = 'The same nutrient can\'t be added twice.';
    errorEl.style.display = 'block';
    return;
  }
  for (const c of components) {
    const p = Number(c.percentage);
    if (c.percentage === '' || Number.isNaN(p) || p < 0 || p > 100) {
      errorEl.textContent = 'Every percentage must be a number between 0 and 100.';
      errorEl.style.display = 'block';
      return;
    }
  }

  const btn = document.getElementById('config-save');
  btn.disabled = true;
  try {
    const path = editingConfigId ? `/nutrient-configurations/${editingConfigId}` : '/nutrient-configurations';
    const method = editingConfigId ? 'PATCH' : 'POST';
    const res = await authedFetch(path, { method, body: JSON.stringify({ name, components }) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed to save configuration');
    closeConfigPanel();
    await loadConfigs();
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.style.display = 'block';
  } finally {
    btn.disabled = false;
  }
});

document.getElementById('rows').addEventListener('click', async (e) => {
  const editBtn = e.target.closest('.edit-config-btn');
  const deleteBtn = e.target.closest('.delete-config-btn');

  if (editBtn) {
    editBtn.disabled = true;
    try {
      const res = await authedFetch(`/nutrient-configurations/${editBtn.dataset.id}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Failed to load configuration');
      openConfigPanel(data.configuration, data.components);
    } catch (err) {
      alert(err.message);
    } finally {
      editBtn.disabled = false;
    }
    return;
  }
  if (deleteBtn) {
    if (!confirm('Delete this nutrient configuration? This can\'t be undone.')) return;
    deleteBtn.disabled = true;
    try {
      const res = await authedFetch(`/nutrient-configurations/${deleteBtn.dataset.id}`, { method: 'DELETE' });
      if (!res.ok && res.status !== 204) {
        const data = await res.json();
        throw new Error(data.error || 'Failed to delete configuration');
      }
      await loadConfigs();
    } catch (err) {
      alert(err.message);
      deleteBtn.disabled = false;
    }
  }
});

async function init() {
  const user = await initAdminPage();
  if (!user) return;
  if (user.role !== 'super_admin') {
    document.querySelector('.panel').innerHTML = '<p class="error">Only Super Admin can manage Nutrient Configurations.</p>';
    return;
  }
  const nutrientsRes = await authedFetch('/master/nutrients');
  allNutrients = (await nutrientsRes.json()).items;
  await loadConfigs();
}

init();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Master Lists</title>
<link rel="stylesheet" href="/admin.css" />
<style>
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
  .tab-btn { background: var(--surface); border: 1px solid var(--border-strong); color: var(--text-muted); font-size: 0.82rem; padding: 7px 14px; }
  .tab-btn.active { background: var(--accent-soft); color: var(--accent-hover); border-color: transparent; font-weight: 600; }
  .list-row { display: flex; align-items: center; gap: 8px; padding: 8px 4px; border-bottom: 1px solid var(--border); }
  .list-row:last-child { border-bottom: none; }
  .list-name { flex: 1; font-size: 0.9rem; }
</style>
</head>
<body>

<div id="admin-nav"></div>

<div class="page page-wide">
<div class="panel">
<h1>Master Lists</h1>
<p id="scope-note" class="scope-note"></p>

<div class="tabs" id="tabs"></div>

<p id="list-error" class="error" style="display:none"></p>
<div id="list"></div>
<div id="top-add" class="bottom-add" style="display:none">
  <input type="text" id="top-add-input" placeholder="New item name" />
  <button id="top-add-btn" class="primary">+ Add</button>
</div>
</div>
</div>

<script src="/admin-shared.js"></script>
<script>
const LISTS = [
  { path: 'training-topics', label: 'Training Topics' },
  { path: 'field-day-topics', label: 'Field Day Topics' },
  { path: 'issue-types', label: 'Issue Types' },
  { path: 'diseases', label: 'Diseases' },
  { path: 'pests', label: 'Pests' },
  { path: 'techniques', label: 'Techniques / Recommendations' },
  { path: 'good-things-observed', label: 'Good Things Observed' },
  { path: 'seasons', label: 'Seasons' },
  { path: 'units', label: 'Units' },
];

let currentUser = null;
let currentPath = LISTS[0].path;
let editingId = null;
let deletingId = null;
let assigningId = null;
let allCountries = [];
let countryNameById = new Map();
const cache = new Map();

function canWrite() {
  return currentUser.role === 'super_admin';
}

function countryBadgeHtml(item) {
  if (!item.country_ids || !item.country_ids.length) {
    return '<span class="country-badge">Global</span>';
  }
  const names = item.country_ids.map((id) => countryNameById.get(id) || '?').join(', ');
  return `<span class="country-badge restricted">Only: ${escapeHtml(names)}</span>`;
}

function countryChecklistHtml(item) {
  const assigned = new Set(item.country_ids || []);
  const options = allCountries.map((c) => `
    <label>
      <input type="checkbox" class="country-check" value="${c.id}" ${assigned.has(c.id) ? 'checked' : ''} />
      ${escapeHtml(c.name)}
    </label>
  `).join('');
  return `
    <div class="country-checklist" data-id="${item.id}">${options}</div>
    <div class="country-checklist-actions">
      <button class="small save-countries-btn primary" data-id="${item.id}">Save</button>
      <button class="small cancel-btn">Cancel</button>
    </div>
  `;
}

function showError(message) {
  const el = document.getElementById('list-error');
  el.textContent = message;
  el.style.display = 'block';
}
function clearError() {
  document.getElementById('list-error').style.display = 'none';
}

function renderTabs() {
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = LISTS.map(
    (l) => `<button class="tab-btn ${l.path === currentPath ? 'active' : ''}" data-path="${l.path}">${l.label}</button>`,
  ).join('');
}

async function fetchItems(path, force = false) {
  if (!force && cache.has(path)) return cache.get(path);
  const res = await authedFetch(`/master/${path}`);
  const data = await res.json();
  cache.set(path, data.items);
  return data.items;
}

async function render() {
  renderTabs();
  document.getElementById('top-add').style.display = canWrite() ? 'flex' : 'none';

  const items = await fetchItems(currentPath);
  const listEl = document.getElementById('list');

  if (!items.length) {
    listEl.innerHTML = '<p class="empty">Nothing here yet.</p>';
    return;
  }

  listEl.innerHTML = items
    .map((item) => {
      if (item.id === editingId) {
        return `
          <div class="list-row">
            <input type="text" class="rename-input" value="${escapeHtml(item.name)}" data-id="${item.id}" style="flex:1" />
            <button class="small save-rename-btn primary" data-id="${item.id}">Save</button>
            <button class="small cancel-btn">Cancel</button>
          </div>`;
      }
      if (item.id === deletingId) {
        return `
          <div class="list-row">
            <span class="list-name" style="color:var(--danger)">Delete "${escapeHtml(item.name)}"?</span>
            <button class="small confirm-delete-btn" data-id="${item.id}" style="background:var(--danger);color:white">Confirm Delete</button>
            <button class="small cancel-btn">Cancel</button>
          </div>`;
      }
      return `
        <div>
          <div class="list-row">
            <span class="list-name">${escapeHtml(item.name)}</span>
            ${countryBadgeHtml(item)}
            ${canWrite() ? `
              <button class="small edit-btn" data-id="${item.id}">Rename</button>
              <button class="small countries-btn" data-id="${item.id}">Countries</button>
              <button class="small delete-btn" data-id="${item.id}">Delete</button>
            ` : ''}
          </div>
          ${item.id === assigningId ? countryChecklistHtml(item) : ''}
        </div>`;
    })
    .join('');
}

document.getElementById('tabs').addEventListener('click', (e) => {
  const btn = e.target.closest('.tab-btn');
  if (!btn) return;
  currentPath = btn.dataset.path;
  editingId = null;
  deletingId = null;
  assigningId = null;
  clearError();
  render();
});

document.getElementById('list').addEventListener('click', async (e) => {
  const editBtn = e.target.closest('.edit-btn');
  const deleteBtn = e.target.closest('.delete-btn');
  const countriesBtn = e.target.closest('.countries-btn');
  const saveBtn = e.target.closest('.save-rename-btn');
  const saveCountriesBtn = e.target.closest('.save-countries-btn');
  const confirmDeleteBtn = e.target.closest('.confirm-delete-btn');
  const cancelBtn = e.target.closest('.cancel-btn');

  if (editBtn) {
    editingId = editBtn.dataset.id;
    deletingId = null;
    assigningId = null;
    clearError();
    render();
    return;
  }
  if (deleteBtn) {
    deletingId = deleteBtn.dataset.id;
    editingId = null;
    assigningId = null;
    clearError();
    render();
    return;
  }
  if (countriesBtn) {
    assigningId = countriesBtn.dataset.id;
    editingId = null;
    deletingId = null;
    clearError();
    render();
    return;
  }
  if (saveCountriesBtn) {
    const id = saveCountriesBtn.dataset.id;
    const checked = [...document.querySelectorAll(`.country-checklist[data-id="${id}"] .country-check:checked`)]
      .map((el) => el.value);
    try {
      const res = await authedFetch(`/master/${currentPath}/${id}/countries`, {
        method: 'PUT',
        body: JSON.stringify({ countryIds: checked }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Save failed');
      assigningId = null;
      cache.delete(currentPath);
      clearError();
      render();
    } catch (err) {
      showError('Saving countries failed: ' + err.message);
    }
    return;
  }
  if (cancelBtn) {
    editingId = null;
    deletingId = null;
    assigningId = null;
    render();
    return;
  }
  if (saveBtn) {
    const id = saveBtn.dataset.id;
    const input = document.querySelector(`.rename-input[data-id="${id}"]`);
    const name = input.value.trim();
    if (!name) return;
    try {
      const res = await authedFetch(`/master/${currentPath}/${id}`, { method: 'PATCH', body: JSON.stringify({ name }) });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Rename failed');
      editingId = null;
      cache.delete(currentPath);
      clearError();
      render();
    } catch (err) {
      showError('Rename failed: ' + err.message);
    }
    return;
  }
  if (confirmDeleteBtn) {
    const id = confirmDeleteBtn.dataset.id;
    try {
      const res = await authedFetch(`/master/${currentPath}/${id}`, { method: 'DELETE' });
      if (!res.ok) {
        const data = await res.json();
        throw new Error(data.error || 'Delete failed');
      }
      deletingId = null;
      cache.delete(currentPath);
      clearError();
      render();
    } catch (err) {
      showError('Delete failed: ' + err.message);
    }
  }
});

document.getElementById('top-add-btn').addEventListener('click', async () => {
  const input = document.getElementById('top-add-input');
  const name = input.value.trim();
  if (!name) return;
  try {
    const res = await authedFetch(`/master/${currentPath}`, { method: 'POST', body: JSON.stringify({ name }) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Add failed');
    input.value = '';
    cache.delete(currentPath);
    clearError();
    render();
  } catch (err) {
    showError('Add failed: ' + err.message);
  }
});

async function init() {
  currentUser = await initAdminPage();
  if (!currentUser) return;
  if (currentUser.role !== 'admin' && currentUser.role !== 'super_admin') {
    document.querySelector('.panel').innerHTML = '<p class="error">Only Admin and Super Admin can access Master Lists.</p>';
    return;
  }

  const countriesRes = await authedFetch('/locations/countries');
  const countriesData = await countriesRes.json();
  allCountries = countriesData.countries;
  countryNameById = new Map(allCountries.map((c) => [c.id, c.name]));

  const scopeNote = document.getElementById('scope-note');
  scopeNote.textContent = currentUser.role === 'admin'
    ? 'These lists are managed by Super Admin only. You can view them here.'
    : 'As Super Admin, you manage these global lists.';

  render();
}

init();
</script>
</body>
</html>

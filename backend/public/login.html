<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Admin Login</title>
<link rel="stylesheet" href="/admin.css" />
</head>
<body>

<div class="login-wrap">
<div class="panel">
  <h1>Admin Login</h1>
  <form id="login-form">
    <label>Email or Mobile</label>
    <input id="login-identifier" type="text" autocomplete="username" />
    <label>Password</label>
    <input id="login-password" type="password" autocomplete="current-password" />
    <p id="login-error" class="error" style="display:none"></p>
    <button id="login-submit" class="primary" type="submit">Log In</button>
  </form>
  <p style="text-align:center; margin-top:16px;">
    <a href="#" id="forgot-password" style="color:var(--text-muted); font-size:0.85rem;">Forgot password?</a>
  </p>
  <p id="forgot-password-note" style="display:none; color:var(--text-muted); font-size:0.85rem; text-align:center; margin-top:8px;">
    Ask a Super Admin to reset your password.
  </p>
</div>
</div>

<script src="/admin-shared.js"></script>
<script>
if (getToken()) {
  window.location.href = '/admin/dashboard';
}

document.getElementById('forgot-password').addEventListener('click', (e) => {
  e.preventDefault();
  document.getElementById('forgot-password-note').style.display = 'block';
});

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const identifier = document.getElementById('login-identifier').value.trim();
  const password = document.getElementById('login-password').value;
  const errorEl = document.getElementById('login-error');
  errorEl.style.display = 'none';

  try {
    const res = await fetch('/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ identifier, password }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Login failed');
    const WEB_ROLES = ['admin', 'super_admin', 'leadership', 'tfo', 'supervisor', 'team_lead', 'country_manager'];
    if (!WEB_ROLES.includes(data.user.role)) {
      throw new Error('This account does not have web access - please use the mobile app instead.');
    }
    setToken(data.token);
    window.location.href = '/admin/dashboard';
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.style.display = 'block';
  }
});
</script>
</body>
</html>

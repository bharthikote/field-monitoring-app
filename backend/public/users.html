<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>All Users</title>
<link rel="stylesheet" href="/admin.css" />
<style>
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: var(--text); }
  .sort-arrow { font-size: 0.65rem; margin-left: 3px; opacity: 0.6; }
  tr.changed-row { background: var(--accent-soft); }
  .save-bar { display: none; margin-top: 20px; justify-content: flex-end; align-items: center; gap: 12px; }
</style>
</head>
<body>

<div id="admin-nav"></div>

<div class="page page-wide">
<div class="panel">
<h1>Users</h1>
<div class="tab-bar" style="margin: 14px 0 18px;">
  <button type="button" class="tab-btn active" data-tab="all-users">All Users</button>
  <button type="button" class="tab-btn" data-tab="pending">Pending Approvals<span class="tab-badge" id="pending-badge" style="display:none"></span></button>
</div>

<div id="tab-all-users">
<div class="inline-form" style="margin-bottom: 4px;">
  <div class="search-wrap">
    <input type="text" id="search-input" placeholder="Search by name, contact, role, status, location..." />
    <span class="search-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
  </div>
</div>
<p id="status" class="empty">Loading...</p>
<div class="table-scroll">
<table id="table" style="display:none">
  <thead>
    <tr>
      <th class="sortable" data-sort="user_code">ID<span class="sort-arrow" id="arrow-user_code"></span></th>
      <th class="sortable" data-sort="name">Name<span class="sort-arrow" id="arrow-name"></span></th>
      <th>Contact</th>
      <th class="sortable" data-sort="role">Role<span class="sort-arrow" id="arrow-role"></span></th>
      <th class="sortable" data-sort="status">Status<span class="sort-arrow" id="arrow-status"></span></th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody id="rows"></tbody>
</table>
</div>

<div class="save-bar" id="save-bar">
  <span class="scope-note" id="pending-changes-count"></span>
  <button id="discard-btn" style="background:var(--surface);border:1px solid var(--border-strong);color:var(--text)">Discard</button>
  <button id="save-all-btn" class="primary">Save Changes</button>
</div>
</div>

<div id="tab-pending" style="display:none">
  <p class="scope-note" style="margin-top:0">A user needs at least one location assigned before they can be approved (Leadership is exempt - they see all countries). Use Preview to assign one first if needed.</p>
  <p id="pending-status" class="empty">Loading...</p>
  <p class="error" id="pending-action-error" style="display:none"></p>
  <div class="table-scroll">
  <table id="pending-table" style="display:none">
    <thead>
      <tr><th>ID</th><th>Name</th><th>Contact</th><th>Role</th><th>Requested</th><th>Action</th></tr>
    </thead>
    <tbody id="pending-rows"></tbody>
  </table>
  </div>
</div>
</div>

<a href="/admin/create-user" class="fab" id="create-user-fab" title="Create User" style="display:none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></a>
</div>

<script src="/admin-shared.js"></script>
<script>
const ROLE_LABELS = {
  tfo: 'Extension Agent (TFO)',
  supervisor: 'Supervisor',
  team_lead: 'Team Lead',
  country_manager: 'Country Manager',
  admin: 'Admin',
  super_admin: 'Super Admin',
  leadership: 'Leadership',
  data_enumerator: 'Data Enumerator',
};
const ASSIGNABLE_ROLES = ['tfo', 'supervisor', 'team_lead', 'country_manager', 'admin', 'leadership', 'data_enumerator'];
const STATUS_LABELS = { pending: 'Pending', approved: 'Approved', rejected: 'Rejected', deactivated: 'Deactivated' };
const STATUSES = ['pending', 'approved', 'rejected', 'deactivated'];

const EYE_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>';
const CHECK_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
const X_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';

let currentUser = null;
let allUsers = [];
let searchQuery = '';
let sortField = null;
let sortDir = 'asc';
const pendingChanges = new Map(); // userId -> { role?, status? }

function locationSummary(user) {
  return user.location_summary || '—';
}

function getVisibleUsers() {
  let list = allUsers;
  if (searchQuery.trim()) {
    const q = searchQuery.trim().toLowerCase();
    list = list.filter((u) => {
      const contact = (u.email || u.mobile_number || '').toLowerCase();
      const haystack = [
        u.name, contact, u.user_code, ROLE_LABELS[u.role], STATUS_LABELS[u.status], locationSummary(u),
      ].join(' ').toLowerCase();
      return haystack.includes(q);
    });
  }
  if (sortField) {
    const labelFor = { role: ROLE_LABELS, status: STATUS_LABELS };
    list = [...list].sort((a, b) => {
      const av = (labelFor[sortField] ? labelFor[sortField][a[sortField]] : a[sortField]) || '';
      const bv = (labelFor[sortField] ? labelFor[sortField][b[sortField]] : b[sortField]) || '';
      const cmp = String(av).localeCompare(String(bv));
      return sortDir === 'asc' ? cmp : -cmp;
    });
  }
  return list;
}

function updateSortArrows() {
  ['user_code', 'name', 'role', 'status'].forEach((f) => {
    document.getElementById(`arrow-${f}`).textContent = f === sortField ? (sortDir === 'asc' ? '▲' : '▼') : '';
  });
}

function updateSaveBar() {
  const bar = document.getElementById('save-bar');
  const count = pendingChanges.size;
  bar.style.display = count > 0 ? 'flex' : 'none';
  document.getElementById('pending-changes-count').textContent = count === 1 ? '1 unsaved change' : `${count} unsaved changes`;
}

async function loadUsers() {
  const statusEl = document.getElementById('status');
  try {
    const res = await authedFetch('/admin/users');
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed to load users');
    allUsers = data.users;
    render();
  } catch (err) {
    if (err.message.includes('expired')) return;
    statusEl.textContent = 'Failed to load users: ' + err.message;
    statusEl.className = 'error';
    statusEl.style.display = 'block';
  }
}

function render() {
  const statusEl = document.getElementById('status');
  const table = document.getElementById('table');
  const rows = document.getElementById('rows');
  const visible = getVisibleUsers();

  if (!allUsers.length) {
    statusEl.textContent = 'No users found.';
    statusEl.style.display = 'block';
    table.style.display = 'none';
    return;
  }
  if (!visible.length) {
    statusEl.textContent = 'No users match your search.';
    statusEl.style.display = 'block';
    table.style.display = 'none';
    return;
  }

  statusEl.style.display = 'none';
  table.style.display = 'table';
  updateSortArrows();
  rows.innerHTML = '';

  for (const user of visible) {
    const tr = document.createElement('tr');
    const isSelf = user.id === currentUser.id;
    const change = pendingChanges.get(user.id);
    if (change) tr.classList.add('changed-row');

    const contact = user.email || user.mobile_number;
    const effectiveRole = change?.role ?? user.role;
    const effectiveStatus = change?.status ?? user.status;

    const canEditRole = !isSelf && ASSIGNABLE_ROLES.includes(user.role);
    const roleCell = canEditRole
      ? `<select class="role-select" data-user-id="${user.id}">
          ${ASSIGNABLE_ROLES.map((v) => `<option value="${v}" ${v === effectiveRole ? 'selected' : ''}>${ROLE_LABELS[v]}</option>`).join('')}
        </select>`
      : `<span class="role-badge">${ROLE_LABELS[user.role] || user.role}</span>`;

    const statusCell = !isSelf
      ? `<select class="status-select" data-user-id="${user.id}">
          ${STATUSES.map((v) => `<option value="${v}" ${v === effectiveStatus ? 'selected' : ''}>${STATUS_LABELS[v]}</option>`).join('')}
        </select>`
      : `<span class="role-badge">${STATUS_LABELS[user.status]}</span>`;

    tr.innerHTML = `
      <td><code>${escapeHtml(user.user_code)}</code></td>
      <td>${escapeHtml(user.name)}</td>
      <td>${escapeHtml(contact)}</td>
      <td>${roleCell}</td>
      <td>${statusCell}</td>
      <td><div class="actions-cell"><a href="/admin/user-profile/${user.id}" class="btn edit-btn">${EYE_ICON} Preview</a></div></td>
    `;
    rows.appendChild(tr);
  }
  enhanceAllSelects(rows);
}

document.getElementById('search-input').addEventListener('input', (e) => {
  searchQuery = e.target.value;
  render();
});

document.querySelectorAll('th.sortable').forEach((th) => {
  th.addEventListener('click', () => {
    const field = th.dataset.sort;
    if (sortField === field) {
      sortDir = sortDir === 'asc' ? 'desc' : 'asc';
    } else {
      sortField = field;
      sortDir = 'asc';
    }
    render();
  });
});

document.getElementById('rows').addEventListener('change', (e) => {
  const roleSelect = e.target.closest('.role-select');
  const statusSelect = e.target.closest('.status-select');
  if (roleSelect) {
    const userId = roleSelect.dataset.userId;
    const existing = pendingChanges.get(userId) || {};
    pendingChanges.set(userId, { ...existing, role: roleSelect.value });
    render();
    updateSaveBar();
  }
  if (statusSelect) {
    const userId = statusSelect.dataset.userId;
    const existing = pendingChanges.get(userId) || {};
    pendingChanges.set(userId, { ...existing, status: statusSelect.value });
    render();
    updateSaveBar();
  }
});

document.getElementById('discard-btn').addEventListener('click', () => {
  pendingChanges.clear();
  updateSaveBar();
  render();
});

document.getElementById('save-all-btn').addEventListener('click', async () => {
  const btn = document.getElementById('save-all-btn');
  btn.disabled = true;
  const errors = [];

  for (const [userId, change] of pendingChanges.entries()) {
    try {
      if (change.role !== undefined) {
        const res = await authedFetch(`/admin/users/${userId}/role`, {
          method: 'POST',
          body: JSON.stringify({ role: change.role }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to update role');
      }
      if (change.status !== undefined) {
        const res = await authedFetch(`/admin/users/${userId}/status`, {
          method: 'POST',
          body: JSON.stringify({ status: change.status }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to update status');
      }
    } catch (err) {
      errors.push(err.message);
    }
  }

  pendingChanges.clear();
  updateSaveBar();
  btn.disabled = false;
  await loadUsers();

  if (errors.length) alert('Some changes failed:\n' + errors.join('\n'));
});

// --- Pending Approvals tab ---

async function loadPending() {
  const statusEl = document.getElementById('pending-status');
  const table = document.getElementById('pending-table');
  const rows = document.getElementById('pending-rows');
  const badge = document.getElementById('pending-badge');

  try {
    const res = await authedFetch('/admin/users/pending');
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed to load pending users');

    badge.style.display = data.users.length > 0 ? 'inline-flex' : 'none';
    badge.textContent = data.users.length;

    if (!data.users.length) {
      statusEl.textContent = 'No pending users right now.';
      statusEl.className = 'empty';
      statusEl.style.display = 'block';
      table.style.display = 'none';
      return;
    }

    statusEl.style.display = 'none';
    table.style.display = 'table';
    rows.innerHTML = '';

    for (const user of data.users) {
      const tr = document.createElement('tr');
      const contact = user.email || user.mobile_number;
      const requested = new Date(user.created_at).toLocaleString();
      const roleOptions = ASSIGNABLE_ROLES
        .map((value) => `<option value="${value}" ${value === user.role ? 'selected' : ''}>${ROLE_LABELS[value]}</option>`)
        .join('');
      tr.innerHTML = `
        <td><code>${escapeHtml(user.user_code)}</code></td>
        <td>${escapeHtml(user.name)}</td>
        <td>${escapeHtml(contact)}</td>
        <td><select class="pending-role-select" data-user-id="${user.id}">${roleOptions}</select></td>
        <td>${requested}</td>
        <td><div class="actions-cell">
          <a href="/admin/user-profile/${user.id}" class="btn edit-btn">${EYE_ICON} Preview</a>
          <button class="approve" data-id="${user.id}" data-action="approve">${CHECK_ICON} Approve</button>
          <button class="reject" data-id="${user.id}" data-action="reject">${X_ICON} Reject</button>
        </div></td>
      `;
      rows.appendChild(tr);
    }
    enhanceAllSelects(rows);
  } catch (err) {
    if (err.message.includes('expired')) return;
    statusEl.textContent = 'Failed to load pending users: ' + err.message;
    statusEl.className = 'error';
    statusEl.style.display = 'block';
  }
}

document.getElementById('pending-rows').addEventListener('click', async (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  const { id, action } = btn.dataset;
  const errorEl = document.getElementById('pending-action-error');
  errorEl.style.display = 'none';
  btn.disabled = true;
  try {
    const body = {};
    if (action === 'approve') {
      const select = document.querySelector(`.pending-role-select[data-user-id="${id}"]`);
      if (select) body.role = select.value;
    }
    const res = await authedFetch(`/admin/users/${id}/${action}`, {
      method: 'POST',
      body: JSON.stringify(body),
    });
    if (!res.ok) {
      const data = await res.json();
      errorEl.textContent = data.error || res.statusText;
      errorEl.style.display = 'block';
      btn.disabled = false;
      return;
    }
    await Promise.all([loadPending(), loadUsers()]);
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.style.display = 'block';
    btn.disabled = false;
  }
});

// --- Tabs ---

document.querySelectorAll('.tab-btn').forEach((btn) => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach((b) => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-all-users').style.display = btn.dataset.tab === 'all-users' ? 'block' : 'none';
    document.getElementById('tab-pending').style.display = btn.dataset.tab === 'pending' ? 'block' : 'none';
  });
});

async function init() {
  currentUser = await initAdminPage();
  if (!currentUser) return;
  if (currentUser.role === 'super_admin') {
    document.getElementById('create-user-fab').style.display = 'flex';
  }
  await Promise.all([loadUsers(), loadPending()]);
}

init();
</script>
</body>
</html>

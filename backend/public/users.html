<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>All Users</title>
<link rel="stylesheet" href="/admin.css" />
<style>
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: var(--text); }
  .sort-arrow { font-size: 0.65rem; margin-left: 3px; opacity: 0.6; }
  tr.changed-row { background: var(--accent-soft); }
  .save-bar { display: none; margin-top: 20px; justify-content: flex-end; align-items: center; gap: 12px; }
</style>
</head>
<body>

<div id="admin-nav"></div>

<div class="page page-wide">
<div class="panel">
<h1>All Users</h1>
<div class="inline-form" style="margin-bottom: 4px;">
  <input type="text" id="search-input" placeholder="Search by name, contact, role, status, location..." style="flex:1" />
</div>
<p id="status" class="empty">Loading...</p>
<table id="table" style="display:none">
  <thead>
    <tr>
      <th class="sortable" data-sort="user_code">ID<span class="sort-arrow" id="arrow-user_code"></span></th>
      <th class="sortable" data-sort="name">Name<span class="sort-arrow" id="arrow-name"></span></th>
      <th>Contact</th>
      <th class="sortable" data-sort="role">Role<span class="sort-arrow" id="arrow-role"></span></th>
      <th class="sortable" data-sort="status">Status<span class="sort-arrow" id="arrow-status"></span></th>
      <th>Current Location</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody id="rows"></tbody>
</table>

<div class="save-bar" id="save-bar">
  <span class="scope-note" id="pending-count"></span>
  <button id="discard-btn" style="background:var(--surface);border:1px solid var(--border-strong);color:var(--text)">Discard</button>
  <button id="save-all-btn" class="primary">Save Changes</button>
</div>

<div id="assign-panel" style="display:none; margin-top: 28px; border-top: 1px solid var(--border); padding-top: 24px;">
  <h2>Assign Location to <span id="assign-name"></span></h2>
  <p class="scope-note">Pick a level, then click "Assign here" at whichever depth you want. Country/State can only be assigned by Super Admin.</p>
  <div id="assign-levels"></div>
  <p class="error" id="assign-error" style="display:none"></p>
  <button id="assign-cancel" style="background:var(--surface);border:1px solid var(--border-strong);color:var(--text);margin-top:12px">Cancel</button>
</div>
</div>
</div>

<script src="/admin-shared.js"></script>
<script>
const ROLE_LABELS = {
  tfo: 'Extension Agent (TFO)',
  supervisor: 'Supervisor',
  team_lead: 'Team Lead',
  country_manager: 'Country Manager',
  admin: 'Admin',
  super_admin: 'Super Admin',
};
const ASSIGNABLE_ROLES = ['tfo', 'supervisor', 'team_lead', 'country_manager', 'admin'];
const STATUS_LABELS = { pending: 'Pending', approved: 'Approved', rejected: 'Rejected' };
const STATUSES = ['pending', 'approved', 'rejected'];

const LEVELS = [
  { key: 'country', label: 'Country', list: (sel) => '/locations/countries', dataKey: 'countries', parentField: null, superAdminOnly: true },
  { key: 'state', label: 'State', list: (sel) => `/locations/states?country_id=${sel.country}`, dataKey: 'states', parentField: 'country', superAdminOnly: true },
  { key: 'district', label: 'District', list: (sel) => `/locations/districts?state_id=${sel.state}`, dataKey: 'districts', parentField: 'state', superAdminOnly: false },
  { key: 'block', label: 'Block', list: (sel) => `/locations/blocks?district_id=${sel.district}`, dataKey: 'blocks', parentField: 'district', superAdminOnly: false },
  { key: 'village', label: 'Village', list: (sel) => `/locations/villages?block_id=${sel.block}`, dataKey: 'villages', parentField: 'block', superAdminOnly: false },
];

let currentUser = null;
let allUsers = [];
let searchQuery = '';
let sortField = null;
let sortDir = 'asc';
const pendingChanges = new Map(); // userId -> { role?, status? }

let assignTargetUserId = null;
const assignSelected = { country: null, state: null, district: null, block: null, village: null };

function locationSummary(user) {
  const parts = [user.country_name, user.state_name, user.district_name, user.block_name, user.village_name].filter(Boolean);
  return parts.length ? parts.join(' › ') : '—';
}

function getVisibleUsers() {
  let list = allUsers;
  if (searchQuery.trim()) {
    const q = searchQuery.trim().toLowerCase();
    list = list.filter((u) => {
      const contact = (u.email || u.mobile_number || '').toLowerCase();
      const haystack = [
        u.name, contact, u.user_code, ROLE_LABELS[u.role], STATUS_LABELS[u.status], locationSummary(u),
      ].join(' ').toLowerCase();
      return haystack.includes(q);
    });
  }
  if (sortField) {
    const labelFor = { role: ROLE_LABELS, status: STATUS_LABELS };
    list = [...list].sort((a, b) => {
      const av = (labelFor[sortField] ? labelFor[sortField][a[sortField]] : a[sortField]) || '';
      const bv = (labelFor[sortField] ? labelFor[sortField][b[sortField]] : b[sortField]) || '';
      const cmp = String(av).localeCompare(String(bv));
      return sortDir === 'asc' ? cmp : -cmp;
    });
  }
  return list;
}

function updateSortArrows() {
  ['user_code', 'name', 'role', 'status'].forEach((f) => {
    document.getElementById(`arrow-${f}`).textContent = f === sortField ? (sortDir === 'asc' ? '▲' : '▼') : '';
  });
}

function updateSaveBar() {
  const bar = document.getElementById('save-bar');
  const count = pendingChanges.size;
  bar.style.display = count > 0 ? 'flex' : 'none';
  document.getElementById('pending-count').textContent = count === 1 ? '1 unsaved change' : `${count} unsaved changes`;
}

async function loadUsers() {
  const res = await authedFetch('/admin/users');
  const data = await res.json();
  allUsers = data.users;
  render();
}

function render() {
  const statusEl = document.getElementById('status');
  const table = document.getElementById('table');
  const rows = document.getElementById('rows');
  const visible = getVisibleUsers();

  if (!allUsers.length) {
    statusEl.textContent = 'No users found.';
    statusEl.style.display = 'block';
    table.style.display = 'none';
    return;
  }
  if (!visible.length) {
    statusEl.textContent = 'No users match your search.';
    statusEl.style.display = 'block';
    table.style.display = 'none';
    return;
  }

  statusEl.style.display = 'none';
  table.style.display = 'table';
  updateSortArrows();
  rows.innerHTML = '';

  for (const user of visible) {
    const tr = document.createElement('tr');
    const isSelf = user.id === currentUser.id;
    const change = pendingChanges.get(user.id);
    if (change) tr.classList.add('changed-row');

    const contact = user.email || user.mobile_number;
    const effectiveRole = change?.role ?? user.role;
    const effectiveStatus = change?.status ?? user.status;

    const canEditRole = !isSelf && ASSIGNABLE_ROLES.includes(user.role);
    const roleCell = canEditRole
      ? `<select class="role-select" data-user-id="${user.id}">
          ${ASSIGNABLE_ROLES.map((v) => `<option value="${v}" ${v === effectiveRole ? 'selected' : ''}>${ROLE_LABELS[v]}</option>`).join('')}
        </select>`
      : `<span class="role-badge">${ROLE_LABELS[user.role] || user.role}</span>`;

    const statusCell = !isSelf
      ? `<select class="status-select" data-user-id="${user.id}">
          ${STATUSES.map((v) => `<option value="${v}" ${v === effectiveStatus ? 'selected' : ''}>${STATUS_LABELS[v]}</option>`).join('')}
        </select>`
      : `<span class="role-badge">${STATUS_LABELS[user.status]}</span>`;

    tr.innerHTML = `
      <td><code>${escapeHtml(user.user_code)}</code></td>
      <td>${escapeHtml(user.name)}</td>
      <td>${escapeHtml(contact)}</td>
      <td>${roleCell}</td>
      <td>${statusCell}</td>
      <td>${escapeHtml(locationSummary(user))}</td>
      <td><button class="primary assign-btn" data-user-id="${user.id}" data-user-name="${escapeHtml(user.name)}">Assign Location</button></td>
    `;
    rows.appendChild(tr);
  }
}

document.getElementById('search-input').addEventListener('input', (e) => {
  searchQuery = e.target.value;
  render();
});

document.querySelectorAll('th.sortable').forEach((th) => {
  th.addEventListener('click', () => {
    const field = th.dataset.sort;
    if (sortField === field) {
      sortDir = sortDir === 'asc' ? 'desc' : 'asc';
    } else {
      sortField = field;
      sortDir = 'asc';
    }
    render();
  });
});

document.getElementById('rows').addEventListener('change', (e) => {
  const roleSelect = e.target.closest('.role-select');
  const statusSelect = e.target.closest('.status-select');
  if (roleSelect) {
    const userId = roleSelect.dataset.userId;
    const existing = pendingChanges.get(userId) || {};
    pendingChanges.set(userId, { ...existing, role: roleSelect.value });
    render();
    updateSaveBar();
  }
  if (statusSelect) {
    const userId = statusSelect.dataset.userId;
    const existing = pendingChanges.get(userId) || {};
    pendingChanges.set(userId, { ...existing, status: statusSelect.value });
    render();
    updateSaveBar();
  }
});

document.getElementById('discard-btn').addEventListener('click', () => {
  pendingChanges.clear();
  updateSaveBar();
  render();
});

document.getElementById('save-all-btn').addEventListener('click', async () => {
  const btn = document.getElementById('save-all-btn');
  btn.disabled = true;
  const errors = [];

  for (const [userId, change] of pendingChanges.entries()) {
    try {
      if (change.role !== undefined) {
        const res = await authedFetch(`/admin/users/${userId}/role`, {
          method: 'POST',
          body: JSON.stringify({ role: change.role }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to update role');
      }
      if (change.status !== undefined) {
        const res = await authedFetch(`/admin/users/${userId}/status`, {
          method: 'POST',
          body: JSON.stringify({ status: change.status }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to update status');
      }
    } catch (err) {
      errors.push(err.message);
    }
  }

  pendingChanges.clear();
  updateSaveBar();
  btn.disabled = false;
  await loadUsers();

  if (errors.length) alert('Some changes failed:\n' + errors.join('\n'));
});

document.getElementById('rows').addEventListener('click', async (e) => {
  const assignBtn = e.target.closest('.assign-btn');
  if (assignBtn) {
    assignTargetUserId = assignBtn.dataset.userId;
    document.getElementById('assign-name').textContent = assignBtn.dataset.userName;
    document.getElementById('assign-panel').style.display = 'block';
    Object.keys(assignSelected).forEach((k) => (assignSelected[k] = null));
    renderAssignLevels();
    await loadAssignLevel(0);
    document.getElementById('assign-panel').scrollIntoView({ behavior: 'smooth' });
  }
});

document.getElementById('assign-cancel').addEventListener('click', () => {
  assignTargetUserId = null;
  document.getElementById('assign-panel').style.display = 'none';
});

function renderAssignLevels() {
  const container = document.getElementById('assign-levels');
  container.innerHTML = LEVELS.map((l) => `
    <div id="assign-level-${l.key}" style="display:none; margin-bottom: 10px;">
      <label style="display:inline-block; width: 80px; font-size: 0.85rem; color:#555;">${l.label}</label>
      <select id="assign-select-${l.key}"><option value="">-- choose ${l.label.toLowerCase()} --</option></select>
      <button class="approve" id="assign-here-${l.key}">Assign here</button>
    </div>
  `).join('');

  LEVELS.forEach((level, index) => {
    document.getElementById(`assign-select-${level.key}`).addEventListener('change', () => onAssignSelectChange(index));
    document.getElementById(`assign-here-${level.key}`).addEventListener('click', () => onAssignHere(level.key));
  });
}

async function loadAssignLevel(levelIndex) {
  const level = LEVELS[levelIndex];
  const container = document.getElementById(`assign-level-${level.key}`);

  if (levelIndex > 0 && !assignSelected[LEVELS[levelIndex - 1].key]) {
    container.style.display = 'none';
    return;
  }
  container.style.display = 'block';

  const res = await authedFetch(level.list(assignSelected));
  const data = await res.json();
  const items = data[level.dataKey];

  const select = document.getElementById(`assign-select-${level.key}`);
  select.innerHTML = `<option value="">-- choose ${level.label.toLowerCase()} --</option>` +
    items.map((item) => `<option value="${item.id}">${escapeHtml(item.name)}</option>`).join('');
  select.value = assignSelected[level.key] || '';

  const canAssign = level.superAdminOnly ? currentUser.role === 'super_admin' : true;
  document.getElementById(`assign-here-${level.key}`).style.display = canAssign ? 'inline-block' : 'none';
}

async function onAssignSelectChange(levelIndex) {
  const level = LEVELS[levelIndex];
  const select = document.getElementById(`assign-select-${level.key}`);
  assignSelected[level.key] = select.value || null;
  for (let i = levelIndex + 1; i < LEVELS.length; i++) assignSelected[LEVELS[i].key] = null;
  for (let i = levelIndex + 1; i < LEVELS.length; i++) await loadAssignLevel(i);
}

async function onAssignHere(levelKey) {
  const errorEl = document.getElementById('assign-error');
  errorEl.style.display = 'none';
  const locationId = assignSelected[levelKey];
  if (!locationId) return;

  try {
    const res = await authedFetch(`/admin/users/${assignTargetUserId}/assign-location`, {
      method: 'POST',
      body: JSON.stringify({ level: levelKey, locationId }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed to assign');
    document.getElementById('assign-panel').style.display = 'none';
    assignTargetUserId = null;
    loadUsers();
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.style.display = 'block';
  }
}

async function init() {
  currentUser = await initAdminPage();
  if (!currentUser) return;
  await loadUsers();
}

init();
</script>
</body>
</html>
